services:
  tauso-web:
    build: .

    # Bring the service back if the process exits -- a failed setup step kills the
    # entrypoint, and without this the container simply stays down.
    restart: unless-stopped

    # Streamlit's own readiness endpoint. start_period covers a first boot, where the
    # setup chain downloads and builds the whole data directory before the UI exists.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      start_period: 30m
      retries: 3

    # A design job holds the genome and transcriptomes in memory. This has to sit BELOW what the
    # WSL VM actually has (8 GB, set in .wslconfig), or it bounds nothing: the kernel OOM-killer
    # fires first and takes the whole VM into swap. Under this cap an overrunning job kills its
    # own container -- a clean, visible failure with the host still responsive.
    mem_limit: 7g
    # pandarallel pickles its chunks through /dev/shm, and Docker's default 64 MB is exhausted the
    # moment a whole-transcript frame is sharded across 8 workers -- it surfaces as the very
    # misleading "[Errno 28] No space left on device" while the disk is 80% free. These pages count
    # against mem_limit above, so the two are sized together: 4g of shm inside a 7g cap leaves
    # roughly 3g for the working set, and the VM's own 8 GB is what both now press against.
    shm_size: 4gb
    # Jobs are queued one at a time, but featurising is threaded and a whole-transcript
    # scan will take every core it is given.
    cpus: 12
    pids_limit: 512

    # The container serves whatever the internet sends it, so it gets nothing it does not
    # need: no capabilities, and no way to gain privileges it was not started with.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Reachable from this host only. The tunnel below is the way in from outside; nothing
    # else on the network can reach the app directly.
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./.tauso_data:/home/mambauser/.tauso_data

    # 1. Load the external file
    # Gives the process a terminal, which is what lets the log formatter and Streamlit's own
    # output emit colour -- without it they detect a pipe and print plain text.
    tty: true

    env_file:
      - .env.local

    # 2. Hardcoded or override variables
    environment:
      - PORT=8501
      - TAUSO_DATA_DIR=/home/mambauser/.tauso_data
      # The machine budget. Everything that spends cores reads these: featurisation and the bowtie
      # off-target search both size themselves from here, and pipeline_runner lowers the core count
      # on its own if the memory would not stretch to that many worker processes. Keep them in step
      # with `cpus` and `mem_limit` above.
      - TAUSO_CORES=12
      - TAUSO_MEMORY_MB=7168
      # 0 tiles the whole transcript instead of stopping after the first N windows from the 5' end.
      # Cost is roughly 0.04 s a candidate in featurisation, so a 8.6 kb transcript like MYO6 adds
      # a few minutes over the old 500-window bound.
      - TAUSO_FIRST_N=0
      # Refuse a submission whose estimated run time exceeds this. Jobs run one at a time, so a
      # multi-hour target blocks the queue rather than only its own submitter. 0 lifts the limit.
      - TAUSO_MAX_RUNTIME_MINUTES=60
      # Cores for the off-target stage alone. Deliberately below TAUSO_CORES: it runs last, on top
      # of everything featurisation still holds, and that peak is what has hit mem_limit.
      - TAUSO_OFFTARGET_CORES=1

  # The public front door, started with `docker compose --profile public up -d`. It dials out
  # to Cloudflare and serves the app over that connection, so the host opens no port and never
  # exposes its address.
  #
  # This is a Quick Tunnel: Cloudflare assigns a random *.trycloudflare.com hostname, so it needs
  # no domain and no token. Read the address out of `docker compose logs cloudflared`. Two things
  # follow from it -- the name changes on every restart, which stales the links already mailed out
  # via PUBLIC_BASE_URL, and Zero Trust Access cannot be applied to a trycloudflare.com hostname,
  # so the job queue is open to anyone holding the URL. It suits a demo, not a standing service.
  #
  # To go back to a named tunnel on a real domain: restore `command: tunnel --no-autoupdate run`
  # and the `env_file` below, put TUNNEL_TOKEN in .env.local, and point the tunnel's route at
  # http://tauso-web:8501 (http, not https; 8501, not 8502).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    profiles:
      - public
    # The named tunnel on tauso.bio. Its hostname survives a restart, which a Quick Tunnel's does
    # not: the address is registered against the tunnel, not minted per process. Where it routes
    # is held by Cloudflare, not here -- the token identifies the tunnel and the dashboard says
    # tauso.bio -> http://tauso-web:8501.
    env_file:
      - .env.local
    depends_on:
      - tauso-web
