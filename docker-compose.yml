version: '3.8'

services:
  tauso-web:
    build: .
    ports:
      - "8501:8501"
    volumes:
      # Maps a local folder named .tauso_data directly into the container
      - ./.tauso_data:/home/mambauser/.tauso_data
    environment:
      - PORT=8501
      - TAUSO_DATA_DIR=/home/mambauser/.tauso_data